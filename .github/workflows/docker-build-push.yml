name: Build and Push Docker Image

# Déclenché par les tags de version, comme build-release.yml : l'image publiée
# correspond alors exactement au commit tagué, donc au même code que les
# exécutables de la release. L'ancien déclencheur (push sur master filtré par
# chemins) construisait l'image avant que le tag existe, puis une seconde fois
# au tag — deux images pour une seule version.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:  # Publication manuelle depuis l'onglet Actions

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Sans les secrets, docker/login-action échoue avec un message peu
      # parlant. Ce contrôle explique quoi faire et où.
      - name: Vérifier les identifiants Docker Hub
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          if [ -z "$DOCKER_USERNAME" ] || [ -z "$DOCKER_PASSWORD" ]; then
            echo "::error::Secrets Docker Hub absents. Dans GitHub : Settings > Secrets and variables > Actions > New repository secret, créer DOCKER_USERNAME (identifiant Docker Hub) et DOCKER_PASSWORD (un access token Docker Hub, pas le mot de passe du compte)."
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Determine version
        id: version
        run: |
          # Sur un tag, le nom du tag fait foi (v2.6.32 -> 2.6.32) ; en
          # déclenchement manuel, on retombe sur version.json.
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(grep '"version"' version.json | head -1 | sed 's/.*"version": "\([^"]*\)".*/\1/')
          fi
          if [ -z "$VERSION" ]; then
            echo "::error::Version introuvable"
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version publiée : $VERSION"

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            darkmind64/parcinfo:latest
            darkmind64/parcinfo:v${{ steps.version.outputs.version }}
          cache-from: type=registry,ref=darkmind64/parcinfo:buildcache
          cache-to: type=registry,ref=darkmind64/parcinfo:buildcache,mode=max

      - name: Résumé
        if: success()
        run: |
          {
            echo "### Image publiée sur Docker Hub"
            echo ""
            echo '```'
            echo "docker pull darkmind64/parcinfo:v${{ steps.version.outputs.version }}"
            echo '```'
            echo ""
            echo "- \`darkmind64/parcinfo:latest\`"
            echo "- \`darkmind64/parcinfo:v${{ steps.version.outputs.version }}\`"
          } >> $GITHUB_STEP_SUMMARY
