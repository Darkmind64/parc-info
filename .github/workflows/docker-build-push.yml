name: Build and Push Docker Image

on:
  push:
    branches:
      - master
    paths:
      - 'Dockerfile'
      - 'app.py'
      - 'requirements.txt'
      - 'version.json'
      - '__version__.py'
      - '.github/workflows/docker-build-push.yml'
  workflow_dispatch:  # Allow manual trigger

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep '"version"' version.json | head -1 | sed 's/.*"version": "\([^"]*\)".*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            darkmind64/parcinfo:latest
            darkmind64/parcinfo:v${{ steps.version.outputs.version }}
          cache-from: type=registry,ref=darkmind64/parcinfo:buildcache
          cache-to: type=registry,ref=darkmind64/parcinfo:buildcache,mode=max

      - name: Push notification
        if: success()
        run: |
          echo "✅ Docker image pushed successfully!"
          echo "Tags:"
          echo "  - darkmind64/parcinfo:latest"
          echo "  - darkmind64/parcinfo:v${{ steps.version.outputs.version }}"

      - name: Failure notification
        if: failure()
        run: |
          echo "❌ Docker build/push failed!"
          exit 1
