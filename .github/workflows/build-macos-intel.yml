name: Build macOS Intel (.app)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-macos-intel:
    name: Build macOS Intel (.app)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rosetta (when runner is Apple Silicon)
        run: |
          if [[ "$(uname -m)" == "arm64" ]]; then
            sudo softwareupdate --install-rosetta --agree-to-license || true
          fi

      - name: Create and use an x86_64 Python virtualenv, install deps and PyInstaller
        run: |
          # Create an x86_64 venv so resulting binary is Intel-compatible when built under Rosetta.
          #
          # macos-latest runners are Apple Silicon now. `arch -x86_64` here only forces the venv's
          # *interpreter file* to be the x86_64 slice — it does NOT carry over to later commands.
          # `source venv/bin/activate` then invoking bare `pip`/`python` runs them under the shell's
          # native arch (arm64), so every wheel with a compiled extension (Pillow, cryptography...)
          # was silently installed arm64-only inside this supposedly-x86_64 venv. Every `python`/`pip`
          # call below must be prefixed with `arch -x86_64` individually, or the mismatch resurfaces.
          arch -x86_64 /usr/bin/python3 -m venv venv
          source venv/bin/activate
          arch -x86_64 python -m pip install --upgrade pip setuptools wheel
          arch -x86_64 python -m pip install pyinstaller
          if [ -f requirements.txt ]; then arch -x86_64 python -m pip install -r requirements.txt; fi
          # If your project is installable, install it so imports work (optional)
          if [ -f setup.py ] || [ -f pyproject.toml ]; then
            arch -x86_64 python -m pip install -e . || true
          fi

      - name: Verify installed wheels are actually x86_64
        run: |
          # Fails fast (seconds, not minutes into the PyInstaller build) if a dependency's
          # compiled extension is still the wrong slice.
          source venv/bin/activate
          bad=0
          while IFS= read -r -d '' so; do
            got=$(lipo -archs "$so" 2>/dev/null || file -b "$so")
            case "$got" in
              *x86_64*) ;;
              *) echo "ARCH MISMATCH: $so -> $got"; bad=1 ;;
            esac
          done < <(find venv/lib -name '*.so' -print0)
          exit $bad

      - name: Build .app with PyInstaller (Intel)
        run: |
          source venv/bin/activate
          # Choose entrypoint: adjust if your main script has a different name
          ENTRY="parcinfo.py"
          if [ -f main.py ]; then ENTRY="main.py"; fi
          if [ -f app.py ]; then ENTRY="app.py"; fi
          if [ -f src/main.py ]; then ENTRY="src/main.py"; fi
          echo "Using entrypoint: $ENTRY"
          # Build a macOS application bundle (.app). Do not use --onefile: we want an app bundle.
          arch -x86_64 venv/bin/pyinstaller --noconfirm --clean --windowed --name "ParcInfo" \
              --distpath dist/mac "$ENTRY"

      - name: List produced artifacts
        run: |
          ls -la dist || true
          ls -la dist/mac || true

      - name: Upload mac .app artifact
        uses: actions/upload-artifact@v4
        with:
          name: ParcInfo-macos-intel
          path: dist/mac/ParcInfo.app
