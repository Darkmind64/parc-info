name: Build & Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  # Rien n'est construit ni publié tant que les suites ne passent pas. Elles
  # existaient déjà mais n'étaient lancées qu'à la main : une version pouvait
  # être publiée sans qu'aucune ne s'exécute.
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Python
        uses: actions/setup-python@v7
        with:
          # La même version que l'image Docker : c'est elle qui a révélé une
          # rupture de syntaxe qu'aucun test local n'avait vue.
          python-version: '3.11'

      - name: Dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install reportlab

      - name: Compilation de tous les modules
        run: python -m compileall -q .

      - name: Concordance des cinq sources de version
        run: python verifier_version.py

      - name: Suites de tests
        run: |
          set -e
          # Découverte automatique de tout test_*.py à la racine : une liste
          # figée à la main avait fini par oublier 12 fichiers de test sur 31,
          # dont celui qui vérifie justement l'application de can_write() sur
          # les routes de suppression — exactement la classe de faille trouvée
          # lors de l'audit du 2026-08-23 (isolation multi-client sur les
          # appareils, cf. test_isolation_client_appareil.py). Un fichier de
          # test ajouté au dépôt tourne désormais en CI sans étape manuelle
          # supplémentaire.
          #
          # Sans serveur graphique, test_collecteur_ui.py s'arrête proprement
          # après avoir éprouvé la construction des rubriques.
          SKIP_TESTS="test_encryption.py"  # script de dev : exige un secret.key préexistant, pas isolé pour la CI
          for f in test_*.py; do
            skip=0
            for s in $SKIP_TESTS; do
              if [ "$f" = "$s" ]; then skip=1; fi
            done
            if [ "$skip" = "1" ]; then
              echo "— ignoré (liste d'exclusion) : $f"
              continue
            fi
            echo "=== $f ==="
            # Vérifié explicitement plutôt que de compter sur la propagation
            # de "set -e" à travers une boucle for — ce comportement diffère
            # selon le dialecte de shell et échouait silencieusement à l'essai
            # local (Git Bash) sans que "set -e" seul ne l'attrape.
            if ! python "$f"; then
              echo "ÉCHEC : $f"
              exit 1
            fi
          done

  build:
    needs: tests
    strategy:
      matrix:
        include:
          - os: windows-latest
            app: parcinfo
            spec: parcinfo.spec
            exe_name: ParcInfo.exe
            asset_name: ParcInfo-Windows.exe
          - os: windows-latest
            app: collector-cli
            spec: collector-cli.spec
            exe_name: system-info-collector.exe
            asset_name: system-info-collector.exe
          - os: windows-latest
            app: collector-gui
            spec: collector-gui.spec
            exe_name: system-info-collector-gui.exe
            asset_name: system-info-collector-gui.exe
          - os: macos-latest
            app: parcinfo
            spec: parcinfo.spec
            asset_name: ParcInfo-macOS-ARM.zip

    runs-on: ${{ matrix.os }}
    continue-on-error: true
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Dépendances
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pillow pystray

      - name: Build PyInstaller
        run: pyinstaller ${{ matrix.spec }}
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"

      - name: Zip .app (macOS)
        if: runner.os == 'macOS'
        run: cd dist && zip -r ${{ matrix.asset_name }} ParcInfo.app

      - name: Rename exe (Windows)
        if: runner.os == 'Windows' && matrix.exe_name != matrix.asset_name
        shell: pwsh
        run: Rename-Item dist\${{ matrix.exe_name }} ${{ matrix.asset_name }}

      - name: Upload artefact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}

      - name: Upload artefact (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}

  # macos-latest est un runner Apple Silicon depuis un moment déjà : produire un
  # binaire Intel demande de croiser sous Rosetta, ce que `build` (ci-dessus) ne
  # fait pas — job séparé, avec ses propres étapes de compilation.
  build-macos-intel:
    needs: tests
    runs-on: macos-latest
    continue-on-error: true
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Python 3.11
        uses: actions/setup-python@v7
        with:
          # Same version as `tests` and `build` above. app.py uses `X | None` syntax
          # that only evaluates at runtime on 3.10+ — macOS's bundled /usr/bin/python3
          # (Xcode Command Line Tools) is 3.9 and crashed on launch with "TypeError:
          # unsupported operand type(s) for |: 'type' and 'NoneType'" the one time this
          # went untested end-to-end (the arch-verify step below only checks compiled
          # .so files, not the interpreter's own version).
          python-version: '3.11'

      - name: Install Rosetta (when runner is Apple Silicon)
        run: |
          if [[ "$(uname -m)" == "arm64" ]]; then
            sudo softwareupdate --install-rosetta --agree-to-license || true
          fi

      - name: Create and use an x86_64 Python virtualenv, install deps
        run: |
          # `arch -x86_64` on the venv-creation line only forces the venv's own
          # interpreter file to be the x86_64 slice — it does NOT carry over to
          # later commands. Invoking bare `pip`/`python` after `source
          # venv/bin/activate` runs them under the runner's native arch (arm64),
          # so every wheel with a compiled extension (Pillow, cryptography...)
          # would silently install arm64-only inside this supposedly-x86_64 venv.
          # Every python/pip call below is prefixed with `arch -x86_64` individually.
          #
          # python.org's official macOS installer (what setup-python fetches) has been
          # universal2 (arm64+x86_64 in one binary) since 3.9.1, so `arch -x86_64` on
          # python3.11 here selects the Intel slice the same way it already does on the
          # system's own Python.
          arch -x86_64 python3.11 -m venv venv
          source venv/bin/activate
          arch -x86_64 python -m pip install --upgrade pip setuptools wheel
          arch -x86_64 python -m pip install pyinstaller pillow pystray
          arch -x86_64 python -m pip install -r requirements.txt
          # cryptography's Rust extension still lands arm64 even with the process-level
          # forcing above (pip's own platform-tag detection under Rosetta picks the wrong
          # one for this package specifically) — force the wheel tag explicitly instead of
          # relying on runtime arch detection. --platform requires --only-binary=:all: (no
          # source build) AND --target (pip refuses platform-specific options on a normal
          # in-place install). Uninstall first so --target doesn't leave stale dist-info/
          # RECORD metadata from the arm64 build sitting alongside the new files.
          arch -x86_64 python -m pip uninstall -y cryptography
          SITE_PACKAGES=$(arch -x86_64 python -c "import sysconfig; print(sysconfig.get_paths()['purelib'])")
          arch -x86_64 python -m pip install --no-deps --only-binary=:all: \
              --platform macosx_10_12_x86_64 --platform macosx_11_0_x86_64 --platform macosx_12_0_x86_64 \
              --target "$SITE_PACKAGES" \
              cryptography

      - name: Verify installed wheels are actually x86_64
        run: |
          # Fails fast (seconds, not minutes into the PyInstaller build) if a
          # dependency's compiled extension is still the wrong slice.
          source venv/bin/activate
          bad=0
          while IFS= read -r -d '' so; do
            got=$(lipo -archs "$so" 2>/dev/null || file -b "$so")
            case "$got" in
              *x86_64*) ;;
              *) echo "ARCH MISMATCH: $so -> $got"; bad=1 ;;
            esac
          done < <(find venv/lib -name '*.so' -print0)
          exit $bad

      - name: Sanity-check app.py actually imports on this Python
        run: |
          # The arch-verify step above only checks compiled .so files, not the
          # interpreter's own version — it would not have caught app.py using
          # `X | None` syntax (runtime-evaluated, Python 3.10+ only) under a
          # too-old interpreter. Import directly instead of waiting to find out
          # from a user running the built .app.
          source venv/bin/activate
          DATA_DIR=$(mktemp -d) RUNNING_IN_DOCKER=1 PARCINFO_BACKUP=0 \
              arch -x86_64 python -c "import app" && echo "app.py imports cleanly"

      - name: Build .app with PyInstaller (Intel)
        run: |
          source venv/bin/activate
          # parcinfo.spec already reads TARGET_ARCH for exactly this — cross-arch
          # building without it means reimplementing packaging (data files, hidden
          # imports, bundle metadata) ad hoc.
          TARGET_ARCH=x86_64 arch -x86_64 venv/bin/pyinstaller --noconfirm --clean parcinfo.spec

      - name: Zip .app
        run: cd dist && zip -r ParcInfo-macOS-Intel.zip ParcInfo.app

      - name: Upload artefact
        uses: actions/upload-artifact@v7
        with:
          name: ParcInfo-macOS-Intel.zip
          path: dist/ParcInfo-macOS-Intel.zip

      # Le collecteur système n'était jusqu'ici compilé QUE pour Windows — un
      # technicien sur Mac devait lancer `python system-info-collector.py` à
      # la main. Même venv x86_64 que ParcInfo ci-dessus, pas de setup Rosetta
      # séparé. La CLI produit un binaire brut (invoqué avec des arguments,
      # comme system-info-collector.exe) — PAS le bundle .app que fabrique
      # aussi collector-cli.spec, pensé pour être lancé depuis le Finder.
      - name: Build collector CLI with PyInstaller (Intel)
        continue-on-error: true
        run: |
          source venv/bin/activate
          arch -x86_64 venv/bin/pyinstaller --noconfirm --clean collector-cli.spec

      - name: Zip collector CLI binary (Intel)
        continue-on-error: true
        run: cd dist && zip system-info-collector-macOS-Intel.zip system-info-collector

      - name: Upload collector CLI artefact (Intel)
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: system-info-collector-macOS-Intel.zip
          path: dist/system-info-collector-macOS-Intel.zip

      # La GUI dépend de Tkinter : son empaquetage sous Rosetta (Tcl/Tk
      # croisé x86_64) est moins éprouvé que le reste de cette chaîne — best
      # effort, isolé pour ne jamais bloquer ParcInfo ni la CLI ci-dessus.
      - name: Build collector GUI with PyInstaller (Intel)
        continue-on-error: true
        run: |
          source venv/bin/activate
          arch -x86_64 venv/bin/pyinstaller --noconfirm --clean collector-gui.spec

      - name: Zip collector GUI .app (Intel)
        continue-on-error: true
        run: cd dist && zip -r system-info-collector-gui-macOS-Intel.zip ParcInfo-Collector.app

      - name: Upload collector GUI artefact (Intel)
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: system-info-collector-gui-macOS-Intel.zip
          path: dist/system-info-collector-gui-macOS-Intel.zip

  docker:
    needs: tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            darkmind64/parcinfo:latest
            darkmind64/parcinfo:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: [build, build-macos-intel, docker]
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download Windows artifact
        uses: actions/download-artifact@v8
        with:
          name: ParcInfo-Windows.exe
          path: ./

      - name: Download macOS ARM artifact
        uses: actions/download-artifact@v8
        with:
          name: ParcInfo-macOS-ARM.zip
          path: ./

      - name: Download macOS Intel artifact
        uses: actions/download-artifact@v8
        with:
          name: ParcInfo-macOS-Intel.zip
          path: ./

      - name: Download system-info-collector.exe
        uses: actions/download-artifact@v8
        with:
          name: system-info-collector.exe
          path: ./

      - name: Download system-info-collector-gui.exe
        uses: actions/download-artifact@v8
        with:
          name: system-info-collector-gui.exe
          path: ./

      # Les deux artefacts ci-dessous viennent des étapes best-effort de
      # build-macos-intel (continue-on-error) : un échec Tk/Rosetta ponctuel
      # ne doit ni bloquer ce job ni la release — l'artefact absent, ce
      # download échoue sans faire échouer le job, et le fichier manque
      # simplement du SHA256SUMS/de la release ci-dessous.
      - name: Download collector CLI macOS Intel artifact
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: system-info-collector-macOS-Intel.zip
          path: ./

      - name: Download collector GUI macOS Intel artifact
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: system-info-collector-gui-macOS-Intel.zip
          path: ./

      # Le programme de mise à jour refuse d'installer un binaire dont il ne peut
      # pas vérifier l'empreinte : sans ce fichier, aucune mise à jour ne passe.
      # Boucle plutôt qu'un seul appel sha256sum : les deux artefacts macOS Intel
      # du collecteur (ci-dessus) sont best-effort et peuvent être absents sans
      # que la release échoue pour autant.
      - name: Empreintes SHA256 des binaires
        run: |
          set -e
          : > SHA256SUMS.txt
          for f in ParcInfo-Windows.exe ParcInfo-macOS-ARM.zip ParcInfo-macOS-Intel.zip \
                   system-info-collector.exe system-info-collector-gui.exe \
                   system-info-collector-macOS-Intel.zip system-info-collector-gui-macOS-Intel.zip; do
            if [ -f "$f" ]; then
              sha256sum "$f" >> SHA256SUMS.txt
            else
              echo "::warning::$f absent — non inclus dans cette release"
            fi
          done
          cat SHA256SUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: ParcInfo ${{ github.ref_name }}
          body: |
            ## ParcInfo ${{ github.ref_name }}

            ### Téléchargements
            | Plateforme | Fichier |
            |-----------|---------|
            | Windows   | `ParcInfo-Windows.exe` |
            | macOS (Apple Silicon M1+) | `ParcInfo-macOS-ARM.zip` → dézipper → `ParcInfo.app` |
            | macOS (Intel) | `ParcInfo-macOS-Intel.zip` → dézipper → `ParcInfo.app` |
            | Docker    | `docker pull darkmind64/parcinfo:${{ github.ref_name }}` |

            ### Collecteurs Système
            | Type | Plateforme | Fichier |
            |------|------------|---------|
            | CLI  | Windows | `system-info-collector.exe` (console) |
            | GUI  | Windows | `system-info-collector-gui.exe` (interface graphique) |
            | CLI  | macOS (Intel) | `system-info-collector-macOS-Intel.zip` → dézipper → binaire `system-info-collector` |
            | GUI  | macOS (Intel) | `system-info-collector-gui-macOS-Intel.zip` → dézipper → `ParcInfo-Collector.app` |

            *(Les deux artefacts macOS ci-dessus sont compilés en best-effort ; s'ils manquent à cette release, lancer `python system-info-collector.py` / `python system-info-collector-gui.py` directement reste toujours possible sur macOS.)*

            ### Docker
            ```bash
            docker pull darkmind64/parcinfo:latest
            docker run -d -p 5010:3456 darkmind64/parcinfo:latest
            # → http://localhost:5010
            ```
            Ou avec docker-compose (voir `docker-compose.yml` dans le repo).

            ### Installation macOS
            Si macOS bloque l'application (non signée) :
            ```bash
            xattr -cr ParcInfo.app
            ```
          files: |
            ./ParcInfo-Windows.exe
            ./ParcInfo-macOS-ARM.zip
            ./ParcInfo-macOS-Intel.zip
            ./system-info-collector.exe
            ./system-info-collector-gui.exe
            ./system-info-collector-macOS-Intel.zip
            ./system-info-collector-gui-macOS-Intel.zip
            ./SHA256SUMS.txt
