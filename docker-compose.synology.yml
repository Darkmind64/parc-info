# ============================================================================
# ParcInfo — Docker Compose Override pour Synology NAS (profil STANDARD)
#
# Pas de numéro de version ici : ce fichier ne change pas d'une version à
# l'autre, et le figer revenait à afficher un numéro périmé à chaque release.
# ============================================================================
#
# USAGE:
#   # Profil standard (NAS moyen, 4+ cores CPU, 2GB+ RAM) — ce fichier
#   docker-compose -f docker-compose.yml -f docker-compose.synology.yml up -d
#
#   # Profil léger (petit NAS, 2-4 cores CPU, 512MB-2GB RAM)
#   docker-compose -f docker-compose.yml -f docker-compose.synology-light.yml up -d
#
#   # Profil lourd (NAS puissant, 8+ cores CPU, 4GB+ RAM)
#   docker-compose -f docker-compose.yml -f docker-compose.synology-heavy.yml up -d
#
#   # Profil développement (hot-reload, PAS pour la production)
#   docker-compose -f docker-compose.yml -f docker-compose.synology-dev.yml up -d
#
# IMPORTANT : chaque profil est un fichier À PART (Docker Compose ne supporte
# pas plusieurs documents YAML séparés par "---" dans un seul fichier passé à
# -f — seul le premier document serait lu, les autres silencieusement
# ignorés). Le nom du service ci-dessous doit rester "parcinfo" (celui déclaré
# dans docker-compose.yml) pour que Compose fusionne bien cet override dans le
# service existant, plutôt que de créer un service fantôme sans image ni port.
#
# Seuls les réglages ci-dessous ont un effet réel : les limites CPU/RAM et la
# rotation des logs sont appliquées par Docker lui-même. ParcInfo ne lit en
# revanche aucune variable d'environnement pour son cache, sa compression ou
# la rétention de son historique — ces réglages se font dans l'application,
# écran Réglages (persistés en base, pas via l'environnement Docker).
# ============================================================================

version: '3.8'

services:
  parcinfo:
    deploy:
      resources:
        limits:
          cpus: '2'          # 2 cores max
          memory: 512M       # 512MB max
        reservations:
          cpus: '0.5'        # 0.5 cores minimum
          memory: 256M       # 256MB minimum

    logging:
      driver: "json-file"
      options:
        max-size: "10m"      # Rotation tous les 10MB
        max-file: "3"        # Garder 3 fichiers max
